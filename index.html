<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antigravity Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="status-bar">
                <div class="system-tag">ANTIGRAVITY v1.0</div>
                <div class="status-indicator">
                    <span class="ping-pulse"></span>
                    <span id="terminal-status">TERMINAL: ONLINE</span>
                </div>
            </div>
            <h1>Command Center</h1>
        </header>

        <main>
            <section class="metrics">
                <div class="metric-card">
                    <span class="label">Memory</span>
                    <div class="bar-bg"><div class="bar-fill" style="width: 45%;"></div></div>
                </div>
                <div class="metric-card">
                    <span class="label">CPU</span>
                    <div class="bar-bg"><div class="bar-fill" style="width: 12%;"></div></div>
                </div>
            </section>

            <section class="console-wrapper">
                <div class="console-header">
                    <span>LIVE LOGS</span>
                    <button id="clear-logs">Clear</button>
                </div>
                <div id="console-logs" class="console-content">
                    <div class="log-entry system">System initialized. Ready for commands.</div>
                </div>
            </section>

            <section class="quick-actions">
                <button class="action-btn" data-cmd="Run Chartink Scan">Run Chartink Scan</button>
                <button class="action-btn" data-cmd="Deploy Site">Deploy Site</button>
                <button class="action-btn" data-cmd="Reset Agent">Reset Agent</button>
                <button class="action-btn secondary" data-cmd="Stop">Stop</button>
            </section>
        </main>

        <footer>
            <form id="command-form">
                <input type="text" id="command-input" placeholder="Execute command..." autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </form>
        </footer>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
