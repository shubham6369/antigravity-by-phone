<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Antigravity | Remote Bridge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Status Bar -->
        <header class="status-bar">
            <div class="status-left">
                <div id="status-indicator" class="status-dot active"></div>
                <span id="agent-status-text">Agent Online</span>
            </div>
            <div class="status-right">
                <button id="clear-logs" class="icon-btn" title="Clear Logs">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14V4zM6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"/></svg>
                </button>
            </div>
        </header>

        <!-- Digital Twin Mirror (Screen + Thoughts) -->
        <main class="main-content">
            <section id="mirror-container" class="mirror-panel">
                <div class="mirror-header">
                    <div class="badge">LIVE MIRROR</div>
                    <div id="tool-display" class="tool-badge">Idle</div>
                </div>
                
                <!-- NEW: Remote Screen Mirror -->
                <div id="remote-container" class="remote-screen-wrapper">
                    <img id="remote-screen" alt="Remote Desktop Mirror" src="">
                    <div class="overlay-grid"></div>
                </div>

                <div id="thought-display" class="thought-bubble">
                    Awaiting instructions...
                </div>
            </section>

            <!-- Real-time Log Console -->
            <section class="console-panel">
                <div class="panel-header">
                    <h3>NEURAL LOGS</h3>
                    <div class="scrolling-indicator"></div>
                </div>
                <div id="console-body" class="console-content">
                    <!-- Logs stream here -->
                </div>
            </section>
        </main>

        <!-- Command Input -->
        <footer class="input-area">
            <form id="command-form" class="command-box">
                <input type="text" id="command-input" placeholder="Transmit instruction..." autocomplete="off">
                <button type="submit" class="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Firebase Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
