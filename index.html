<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antigravity Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="status-bar">
                <div class="system-tag">ANTIGRAVITY v1.0</div>
                <div class="status-indicator">
                    <span class="ping-pulse"></span>
                    <span id="terminal-status">AGENT: READY</span>
                </div>
            </div>
            <h1>Antigravity Remote</h1>
            <div id="agent-state-panel" class="agent-state idle">
                <div class="state-dot"></div>
                <span id="agent-state-text">AGENT IDLE</span>
            </div>
        </header>

        <main class="dashboard-grid">
            <section class="metric-card">
                <h3>Agent Memory</h3>
                <div class="progress-container">
                    <div class="progress-bar" style="width: 45%;"></div>
                </div>
                <p>Context: 12.4k tokens</p>
            </section>
            
            <section class="metric-card">
                <h3>Active Goal</h3>
                <p id="current-goal">Listening for tasks...</p>
            </section>
        </main>

        <section class="terminal-section">
            <div class="console-header">
                <span>AGENT THOUGHT LOGS</span>
                <button id="clear-logs">CLEAR</button>
            </div>
            <div id="console" class="console-content">
                <!-- Logs here -->
            </div>
        </section>

        <div class="quick-actions">
            <button class="action-btn" onclick="sendTask('Build a login page')">Build UI</button>
            <button class="action-btn" onclick="sendTask('Scan for bugs')">Scan Code</button>
            <button class="action-btn" onclick="sendTask('Deploy to production')">Deploy</button>
        </div>
        <button class="action-btn secondary" data-cmd="Stop">Stop</button>

        <footer>
            <form id="command-form">
                <input type="text" id="command-input" placeholder="Execute command..." autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </form>
        </footer>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
