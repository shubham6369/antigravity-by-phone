<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antigravity Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="splash-screen" class="splash-overlay">
        <div class="lock-container">
            <div class="biometric-icon">
                <svg viewBox="0 0 24 24" width="60" height="60"><path fill="currentColor" d="M17.81 4.47c-.08 0-.16.02-.23.06C15.6 5.57 14.07 6 12 6s-3.6-.43-5.58-1.47c-.07-.04-.15-.06-.23-.06-.28 0-.5.22-.5.5 0 .12.04.23.11.32.11.12.18.23.18.45 0 .28.22.5.5.5.08 0 .16-.02.23-.06C8.71 7.23 10.29 7.72 12 7.72s3.29-.49 5.29-1.55c.07-.04.15-.06.23-.06.28 0 .5-.22.5-.5 0-.12-.04-.23-.11-.32-.11-.12-.18-.23-.18-.45 0-.28-.22-.5-.5-.5zM12 10.64c-2.31 0-4.32-.47-5.97-1.4-.23-.14-.52-.06-.65.17-.13.23-.06.52.17.65 1.83 1.04 4.09 1.58 6.45 1.58s4.62-.54 6.45-1.58c.23-.13.3-.42.17-.65s-.42-.3-.65-.17c-1.65.93-3.66 1.4-5.97 1.4z" /></svg>
            </div>
            <div class="unlock-text">BIOMETRIC AUTH REQUIRED</div>
            <button id="unlock-btn">SCAN TO ENTER</button>
        </div>
    </div>
    <div class="app-container">
        <header>
            <div class="status-bar">
                <div class="system-tag">ANTIGRAVITY v1.0</div>
                <div class="status-indicator">
                    <span class="ping-pulse"></span>
                    <span id="agent-status">ONLINE</span>
                </div>
            </div>
            <h1>Command Center</h1>
        </header>

        <main>
            <section class="metrics">
                <div class="metric-card">
                    <span class="label">Memory</span>
                    <div class="bar-bg"><div class="bar-fill" style="width: 45%;"></div></div>
                </div>
                <div class="metric-card">
                    <span class="label">CPU</span>
                    <div class="bar-bg"><div class="bar-fill" style="width: 12%;"></div></div>
                </div>
            </section>

            <section class="console-wrapper">
                <div class="console-header">
                    <span>LIVE LOGS</span>
                    <button id="clear-logs">Clear</button>
                </div>
                <div id="console-logs" class="console-content">
                    <div class="log-entry system">System initialized. Ready for commands.</div>
                </div>
            </section>

            <section class="quick-actions">
                <button class="action-btn" data-cmd="Run Chartink Scan">Run Chartink Scan</button>
                <button class="action-btn" data-cmd="Deploy Site">Deploy Site</button>
                <button class="action-btn" data-cmd="Reset Agent">Reset Agent</button>
                <button class="action-btn secondary" data-cmd="Stop">Stop</button>
            </section>
        </main>

        <footer>
            <form id="command-form">
                <input type="text" id="command-input" placeholder="Execute command..." autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </form>
        </footer>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore.js"></script>
    <script src="app.js"></script>
</body>
</html>
