<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chartink Screener - Large Cap</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .screener-container {
            padding: 20px;
            background: var(--bg-color);
            min-height: 100vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--app-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent-primary);
            font-weight: 600;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .pos { color: var(--accent-tertiary); }
        .neg { color: var(--accent-secondary); }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="screener-container">
        <a href="index.html" class="back-link">← BACK TO CONSOLE</a>
        <h2 style="margin-bottom: 20px;">Large Cap Stocks (>10,000 Cr)</h2>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>% Chg</th>
                    <th>Volume</th>
                </tr>
            </thead>
            <tbody id="stock-data">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>
    <script>
        const stocks = [
            { s: "RELIANCE", p: "2,985.40", c: "+1.45", v: "4.2M" },
            { s: "TCS", p: "4,120.15", c: "-0.32", v: "1.1M" },
            { s: "HDFCBANK", p: "1,450.20", c: "+0.85", v: "8.5M" },
            { s: "INFY", p: "1,620.00", c: "+2.10", v: "3.2M" },
            { s: "ICICIBANK", p: "1,080.50", c: "-0.15", v: "5.4M" },
            { s: "BHARTIARTL", p: "1,210.30", c: "+3.42", v: "2.1M" }
        ];

        const tbody = document.getElementById('stock-data');
        stocks.forEach(st => {
            const row = document.createElement('tr');
            const isPos = st.c.startsWith('+');
            row.innerHTML = `
                <td><strong>${st.s}</strong></td>
                <td>₹${st.p}</td>
                <td class="${isPos ? 'pos' : 'neg'}">${st.c}%</td>
                <td>${st.v}</td>
            `;
            tbody.appendChild(row);
        });
    </script>
</body>
</html>
